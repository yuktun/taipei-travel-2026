<!doctype html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#17483e"><meta name="referrer" content="no-referrer"><title>台北慢遊</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><link rel="stylesheet" href="styles.css"></head>
<body>
<header><a class="brand" href="./">旅途 <span>TAIPEI</span></a><div class="actions"><button id="theme" aria-label="切換日夜主題">◐</button><button id="account">Google 登入</button></div></header>
<main>
<section class="hero"><div class="eyebrow">YOUR LITTLE CITY ESCAPE</div><h1>台北，<br>慢慢行。</h1><p>把想去的地方，留在同一個口袋。</p><div class="skyline" aria-hidden="true"><i></i><i></i><i class="tower"></i><i></i><i></i></div><span class="stamp">TAIPEI<br>TRAVEL CLUB</span></section>
<div class="session-line"><span id="sessionBadge" hidden></span><span id="status" role="status" aria-live="polite">正在準備…</span></div>
<section id="gate"><h2 id="gateTitle">我哋嘅私人旅程</h2><p id="gateMessage">以獲授權的 Google 帳戶登入，查看行程及預訂。</p><div class="gate-actions"><button id="retryAccess" hidden>重新檢查權限</button><button id="preview">查看五日行程靈感</button></div><p class="fine">建議路線全部可選及未預訂；不會顯示私人預訂資料。</p></section>
<section id="workspace" hidden>
<div class="section-head"><div><div class="eyebrow" id="tripDates"></div><h2 id="tripTitle"></h2></div><div class="actions"><span id="role" class="pill"></span><button id="exitPreview" hidden>返回登入</button></div></div>
<nav aria-label="旅行工具"><button data-tab="days" aria-selected="true">每日行程</button><button data-tab="bookings">預訂資料</button><button data-tab="checklist">出發清單</button></nav>
<div id="daysPicker" class="days"></div><div id="content"></div><button id="add" hidden>＋ 加入項目</button><p class="fine">所有時間為當地時間 · 地圖連結會於 Google 地圖開啟</p>
</section>
</main>
<footer>留白一點，旅程自在一點。<span>台北慢遊 / PRIVATE TRAVEL COMPANION</span></footer>
<dialog id="editor"><form id="editForm"><h2>加入行程</h2><label>名稱<input name="title" required maxlength="120"></label><label>日期<input name="date" type="date" required></label><label>時間<input name="time" maxlength="40" placeholder="例如 10:00"></label><label>備註<textarea name="note" maxlength="2000"></textarea></label><label>地圖搜尋地點<input name="place" maxlength="200"></label><p id="editorStatus" role="alert"></p><div class="actions"><button type="button" id="cancel">取消</button><button type="submit">儲存</button></div></form></dialog>
<script type="module" src="app.js"></script>
</body></html>
